<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aLNP Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Layout idea: a lab-notebook style data explorer; left filter rail, tabbed main pane. Palette: lignin brown + teal ink. */
:root{
  --bg:#f4f6fa; --panel:#ffffff; --ink:#14213d; --muted:#5b6678; --line:#d5dbe6;
  --accent:#D50032; --accent-ink:#ffffff; --warn:#a4561a; --bad:#B10000; --navy:#001E62; --slate:#A6C5D7;
  --display:"Fraunces",Georgia,serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1226; --panel:#111b36; --ink:#e8ecf5; --muted:#9fabc4; --line:#2a3a66;
  --accent:#ff5c7f; --accent-ink:#1a0008; --warn:#e0975a; --bad:#ff8a8a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0a1226; --panel:#111b36; --ink:#e8ecf5; --muted:#9fabc4; --line:#2a3a66;
  --accent:#ff5c7f; --accent-ink:#1a0008; --warn:#e0975a; --bad:#ff8a8a; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
header{padding:18px 20px 16px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between;background:var(--navy);color:#fff;border-bottom:4px solid #D50032}
h1{font-family:var(--display);font-size:26px;margin:0;text-wrap:balance}
header h1{color:#fff}
header .sub{color:#c6d0ea}
.sub{color:var(--muted);font-size:13px;max-width:70ch}
nav{display:flex;gap:4px;padding:8px 20px 0;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{font:inherit;background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,th:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:16px 20px 40px;display:grid;grid-template-columns:240px 1fr;gap:20px}
@media(max-width:800px){main{grid-template-columns:1fr}}
aside{display:flex;flex-direction:column;gap:12px;align-self:start}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
input,select{width:100%;font:inherit;padding:7px 8px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px}
.tiles{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:110px}
.tile b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.card h2{font-family:var(--display);font-size:17px;margin:0 0 8px}
.scroll{overflow-x:auto;max-height:560px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--panel);cursor:pointer;white-space:nowrap;font-weight:600;z-index:1}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
tr:hover td{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11px;border:1px solid var(--line);white-space:nowrap}
.pill.lo{border-color:var(--warn);color:var(--warn)}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:12px}
.row>*{flex:1 1 200px}
button.go{font:inherit;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600}
.note{border-left:3px solid var(--warn);padding:6px 10px;font-size:13px;background:color-mix(in srgb,var(--warn) 8%,transparent);margin:10px 0}
.big{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}
.small{font-size:12px}
a{color:var(--accent)}
.hide{display:none}
main.wide{grid-template-columns:minmax(0,1fr)}
section#pane{min-width:0}
/* Periodic Dock + Flow views (scoped to .xl) */
.xl,.xfx{--bg:#0b1016;--panel:#121a22;--panel2:#18232e;--line:#25354a;--text:#e9eff4;--muted:#93a3b3;--amber:#e0a458;--amber-ink:#1c1306;--focus:#8ad0ff;--good:#58c4a0;--warn:#e6b450;--bad:#ef8272;--c-metal:#6db3f2;--c-oxide:#a597f8;--c-organic:#e0a458;--c-polymer:#4fc3a1;--c-bio:#ec7aa0;--c-inorg:#b5c46a;--c-none:#7d8b99;color-scheme:dark}
.xl{background:var(--bg);color:var(--text);font:14px/1.5 var(--body);border-radius:10px;padding:14px;min-width:0}
.xl h1,.xl h2,.xl h3{margin:0;font-family:var(--display);font-weight:700;letter-spacing:-.01em}
.xl p{margin:0}.xl button,.xl input,.xl select{font:inherit;color:inherit}.xl button{cursor:pointer}
.xl a{color:var(--focus)}.xl label{text-transform:none;letter-spacing:0;font-size:inherit;color:inherit;display:inline;margin:0}
.xl svg text{fill:inherit;font-family:inherit;font-size:inherit}
.xl .row>*{flex:0 1 auto}
.xl .card{margin-bottom:0}
.xl .tile{min-width:0}
.xl .tile b{font-size:inherit;font-family:inherit}
.xl .pill{display:inline-block}
.xl table{width:auto}
.xfx .tip{position:fixed;z-index:200}
.xfx .ghost{position:fixed;z-index:210}
.xl .xnote{border-left:3px solid var(--warn);padding:6px 10px;font-size:13px;background:#e6b4501a;margin:0 0 12px}
.xl *{ box-sizing: border-box; }
.xl h1,.xl h2,.xl h3{ margin: 0; font-family: var(--display); font-weight: 700; text-wrap: balance; letter-spacing: -.01em; }
.xl p{ margin: 0; }
.xl button,.xl input,.xl textarea,.xl select{ font: inherit; color: inherit; }
.xl button{ cursor: pointer; }
.xl :focus-visible{ outline: 2px solid var(--focus); outline-offset: 2px; }
.xl a{ color: var(--focus); }
.xl .mono{ font-family: var(--mono); font-variant-numeric: tabular-nums; }
.xl .muted{ color: var(--muted); }
.xl .top{ display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.xl .brand{ display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 16px; }
.xl .brand svg{ flex: none; }
.xl .top .grow{ flex: 1 1 auto; }
.xl .pill{ font: 12px var(--mono); padding: 3px 9px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); background: var(--panel2); }
.xl .btn{ border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 8px 14px; }
.xl .btn:hover{ border-color: var(--muted); }
.xl .btn.primary{ background: var(--amber); border-color: var(--amber); color: var(--amber-ink); font-weight: 600; }
.xl .btn.primary:hover{ filter: brightness(1.08); }
.xl .btn.small{ padding: 4px 10px; font-size: 12.5px; }
.xl .btn[disabled]{ opacity: .45; cursor: not-allowed; }
.xl .page{ max-width: 1320px; margin: 0 auto; padding: 16px; }
.xl .card{ background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.xl .stack{ display: flex; flex-direction: column; gap: 14px; }
.xl .row{ display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.xl .seg{ display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.xl .seg button{ border: 0; background: var(--panel2); padding: 6px 12px; color: var(--muted); }
.xl .seg button + button{ border-left: 1px solid var(--line); }
.xl .seg button[aria-pressed="true"]{ background: var(--amber); color: var(--amber-ink); font-weight: 600; }
.xl .chips{ display: flex; flex-wrap: wrap; gap: 6px; }
.xl .chip{ min-height: 32px; border: 1px solid var(--line); background: var(--panel2); border-radius: 99px; padding: 4px 11px; font-size: 12.5px; color: var(--text); }
.xl .chip .n{ font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: 5px; }
.xl .chip[aria-pressed="true"]{ border-color: var(--amber); background: color-mix(in srgb, var(--amber) 22%, var(--panel2)); }
.xl .chip.draggable{ cursor: grab; }
.xl .tabs{ display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.xl .tabs button{ white-space: nowrap; flex: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; color: var(--muted); font-weight: 500; }
.xl .tabs button[aria-selected="true"]{ color: var(--text); border-bottom-color: var(--amber); }
.xl .dock{ display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; align-items: start; }
@media (max-width: 1040px){.xl .dock{ grid-template-columns: minmax(0, 1fr); }}
.xl .dock-left{ padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.xl .dock-left h2{ font-size: 15px; }
.xl .ptwrap{ overflow-x: auto; padding-bottom: 4px; }
.xl .pt{ display: grid; grid-template-columns: repeat(18, minmax(0, 1fr)); grid-template-rows: repeat(7, auto) 8px repeat(2, auto); gap: 3px; min-width: 600px; }
.xl .el{ position: relative; aspect-ratio: 1; min-width: 0; padding: 0; border-radius: 5px; border: 1px solid var(--line); background: var(--panel); color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none; }
.xl .el .z{ position: absolute; top: 2px; left: 3px; font: 8.5px var(--mono); opacity: .75; }
.xl .el .s{ font: 700 clamp(11px, 1.45vw, 17px) var(--display); line-height: 1; }
.xl .el .n{ font: 9px var(--mono); margin-top: 2px; min-height: 10px; }
.xl .el.off{ opacity: .32; }
.xl .el.has{ cursor: grab; color: var(--text); border-color: color-mix(in srgb, var(--amber) 40%, var(--line));
  background: color-mix(in srgb, var(--amber) calc(var(--t) * 92%), var(--panel2)); }
.xl .el.has.hi{ color: var(--amber-ink); }
.xl .el.has.nil{ background: var(--panel); color: var(--muted); border-style: dashed; }
.xl .el.has:hover{ border-color: var(--text); }
.xl .el.sel{ outline: 2px solid var(--focus); outline-offset: 1px; }
.xl .ramp{ display: flex; align-items: center; gap: 8px; font: 11px var(--mono); color: var(--muted); }
.xl .ramp i{ display: block; height: 8px; width: 120px; border-radius: 4px; background: linear-gradient(90deg, var(--panel2), var(--amber)); border: 1px solid var(--line); }
.xl .shelf{ border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.xl .ghost{ position: fixed; z-index: 60; pointer-events: none; padding: 6px 12px; border-radius: 8px; background: var(--amber); color: var(--amber-ink); font: 700 16px var(--display); box-shadow: 0 6px 24px #000a; transform: translate(-50%, -50%); }
.xl .dock-right{ padding: 14px; display: flex; flex-direction: column; gap: 12px; position: sticky; top: 74px; transition: box-shadow .15s, border-color .15s; }
.xl .dock-right.over{ border-color: var(--amber); box-shadow: 0 0 0 3px color-mix(in srgb, var(--amber) 30%, transparent); }
.xl .dock-right h2{ font-size: 20px; }
.xl .dock-right .sub{ color: var(--muted); font-size: 12.5px; }
.xl .specimen{ background: radial-gradient(circle at 50% 45%, #1b2a3a, var(--panel) 70%); border: 1px solid var(--line); border-radius: 10px; }
.xl .specimen svg{ display: block; width: 100%; height: auto; }
.xl .specimen text{ fill: var(--muted); font: 11px var(--mono); }
.xl .specimen .big{ fill: var(--text); font: 700 15px var(--display); }
.xl .drift{ transform-box: fill-box; transform-origin: center; animation: xl-drift 80s linear infinite; }
@keyframes xl-drift{ to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce){.xl .drift{ animation: none; }
.xl *{ scroll-behavior: auto !important; }}
.xl .legendcap{ font-size: 11.5px; color: var(--muted); }
.xl .tiles{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.xl .tile{ border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; background: var(--panel2); min-width: 0; }
.xl .tile .k{ font-size: 11px; color: var(--muted); }
.xl .tile .v{ font: 500 17px var(--mono); }
.xl .tile .v small{ font-size: 11px; color: var(--muted); margin-left: 2px; }
.xl .tile .d{ font: 11px var(--mono); color: var(--muted); }
.xl .badge{ display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid currentColor; }
.xl .badge.warn{ color: var(--warn); }
.xl .badge.good{ color: var(--good); }
.xl .sect h3{ font-size: 13px; margin-bottom: 6px; font-family: var(--body); font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.xl .stackbar{ display: flex; height: 12px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.xl .stackbar i{ display: block; }
.xl .keys{ display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.xl .keys span::before{ content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; background: var(--k); }
.xl .fnrow{ border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); margin-bottom: 6px; }
.xl .fnrow > button{ width: 100%; text-align: left; background: none; border: 0; padding: 7px 10px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.xl .fnrow .bar{ grid-column: 1 / -1; height: 4px; background: var(--bg); border-radius: 2px; overflow: hidden; }
.xl .fnrow .bar i{ display: block; height: 100%; background: var(--amber); }
.xl .fnrow .met{ padding: 2px 10px 9px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
.xl .fnrow .met b{ color: var(--text); font: 500 12px var(--mono); }
.xl .papers{ display: flex; flex-direction: column; gap: 8px; }
.xl .paper{ font-size: 12.5px; }
.xl .paper b{ font-weight: 600; }
.xl .paper .t{ color: var(--muted); display: block; }
.xl .flow{ display: flex; flex-direction: column; gap: 12px; }
.xl .ftools{ display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; padding: 10px 14px; }
.xl .ftools label.chk{ display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.xl .ftools .lab{ font-size: 12px; color: var(--muted); margin-right: 6px; }
.xl .fgrid{ display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; align-items: start; }
@media (max-width: 1040px){.xl .fgrid{ grid-template-columns: minmax(0, 1fr); }}
.xl .fmain{ padding: 10px 12px 6px; }
.xl .fsum{ font-size: 12.5px; color: var(--muted); padding: 2px 4px 6px; }
.xl .swrap{ overflow-x: auto; }
.xl .swrap svg{ display: block; width: 100%; min-width: 780px; height: auto; }
.xl .colhead{ fill: var(--muted); font: 600 11px var(--body); letter-spacing: .08em; text-transform: uppercase; }
.xl .lbl{ fill: var(--text); font: 12px var(--body); paint-order: stroke; stroke: var(--bg); stroke-width: 3.5px; stroke-linejoin: round; }
.xl .lbl .c{ fill: var(--muted); font: 10.5px var(--mono); }
.xl .node{ cursor: pointer; }
.xl .node rect{ stroke: var(--bg); stroke-width: 1; }
.xl .link{ fill: none; transition: opacity .15s; }
.xl .trace{ fill: none; pointer-events: none; }
.xl .link.dim{ opacity: .2; }
.xl .node.dim{ opacity: .4; }
.xl .hit{ fill: none; stroke: transparent; pointer-events: stroke; }
.xl .link{ pointer-events: none; }
.xl .link.hot{ stroke-opacity: .75 !important; }
.xl .node .nh{ stroke: none; }
.xl .node.sel .nr{ stroke: #fff; stroke-width: 2; }
.xl .ab{ display: inline-block; min-width: 16px; text-align: center; font: 700 10.5px var(--mono); border-radius: 4px; padding: 0 4px; margin-right: 6px; background: #e0a458; color: #1c1306; }
.xl .ab.b{ background: #8ad0ff; }
.xl .abchip{ display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 99px; padding: 3px 4px 3px 10px; font-size: 12.5px; background: var(--panel2); }
.xl .abchip.a{ border-color: #e0a458; }
.xl .abchip.b{ border-color: #8ad0ff; }
.xl .abchip b{ font: 700 11px var(--mono); }
.xl .abchip button{ background: none; border: 0; color: var(--muted); font-size: 17px; line-height: 1; padding: 0 7px; }
.xl .el.selb{ outline: 2px solid #8ad0ff; outline-offset: 1px; }
.xl .cmp-on .dock-left{ outline: 2px dashed #8ad0ff; outline-offset: 2px; }
.xl .rel{ width: 100%; height: auto; display: block; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; }
.xl .rel text{ fill: var(--muted); font: 10px var(--mono); }
.xl .rel .domain,.xl .rel .tick line{ stroke: var(--line); }
.xl select{ background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; max-width: 100%; color: var(--text, inherit); }
.xl .molgrid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; }
.xl .mol{ display: flex; flex-direction: column; align-items: stretch; gap: 4px; padding: 6px 6px 7px; border: 1px solid color-mix(in srgb, var(--amber) calc(var(--t, 0) * 70%), var(--line)); border-radius: 10px; background: transparent; color: var(--text, inherit); text-align: left; cursor: grab; touch-action: manipulation; }
.xl .mol:hover{ border-color: var(--amber); }
.xl .mol[aria-pressed="true"]{ outline: 2px solid var(--amber); outline-offset: 1px; }
.xl .mol .st{ height: 84px; display: grid; place-items: center; }
.xl .mol .st svg{ width: auto; height: auto; max-width: 100%; max-height: 100%; }
.xl .mol .nm{ font-size: 11.5px; line-height: 1.2; display: flex; justify-content: space-between; gap: 6px; }
.xl .mol .nm .n{ font: 11px var(--mono); color: var(--muted); }
.xl .mol .mix{ font-size: 10.5px; color: var(--muted); text-align: center; padding: 0 6px; }
.xl .molnote{ font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.xl .dockstruct{ float: right; width: 210px; height: 130px; margin: 0 0 6px 10px; }
@media (max-width: 520px){ .xl .dockstruct{ width: 150px; height: 98px; } }
.xl .dockstruct svg{ width: 100%; height: 100% }
.xl .specimen .tag{ font: 700 12px var(--display); }
@media (max-height: 720px){.xl .dock-right,.xl .fside{ position: static; }}
.xl .fside{ padding: 14px; display: flex; flex-direction: column; gap: 12px; position: sticky; top: 74px; }
.xl .fside h2{ font-size: 18px; }
.xl .dist{ display: flex; flex-direction: column; gap: 5px; }
.xl .dist .r{ display: grid; grid-template-columns: minmax(0, 1fr) 40px; gap: 2px 8px; font-size: 12.5px; }
.xl .dist .r .b{ grid-column: 1 / -1; height: 4px; background: var(--bg); border-radius: 2px; overflow: hidden; }
.xl .dist .r .b i{ display: block; height: 100%; }
.xl .dist .r span:last-child{ text-align: right; font: 12px var(--mono); color: var(--muted); }
.xl .tip{ position: fixed; z-index: 70; pointer-events: none; background: #05080c; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; max-width: 280px; box-shadow: 0 6px 20px #0009; }
.xl .tip b{ font-weight: 600; }
.xl .tip .mono{ color: var(--amber); }
.xfx .ghost{ position: fixed; z-index: 60; pointer-events: none; padding: 6px 12px; border-radius: 8px; background: var(--amber); color: var(--amber-ink); font: 700 16px var(--display); box-shadow: 0 6px 24px #000a; transform: translate(-50%, -50%); }
.xfx .tip{ position: fixed; z-index: 70; pointer-events: none; background: #05080c; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; max-width: 280px; box-shadow: 0 6px 20px #0009; }
.xfx .tip b{ font-weight: 600; }
.xfx .tip .mono{ color: var(--amber); }
.xl .ftools label.chk{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;margin:0;width:auto}
.xl input[type=checkbox]{width:auto;margin:0}
/* UIC palette overrides for the ported views */
.xl,.xfx{--bg:#f4f6fa;--panel:#ffffff;--panel2:#eaeff7;--line:#d5dbe6;--text:#14213d;--muted:#5b6678;--amber:#D50032;--amber-ink:#ffffff;--focus:#001E62;--ca:#D50032;--cb:#001E62;--cb-ink:#ffffff;--good:#1b7f5c;--warn:#a4561a;--bad:#B10000;--c-metal:#2F5BB7;--c-oxide:#8FA9D6;--c-organic:#D50032;--c-polymer:#F08CA2;--c-bio:#6FA3C0;--c-inorg:#5E6B7A;--c-none:#9AA3AF;color-scheme:light}

<body>
<header>
  <h1>aLNP Explorer</h1>
  <div class="sub">Augmented lignin nanoparticles from published literature. Every row has its paper, page and an extraction confidence. Prototype, not yet peer checked.</div>
</header>
<nav role="tablist" id="tabs">
  <button role="tab" aria-selected="true" data-t="explore">Explore</button>
  <button role="tab" aria-selected="false" data-t="charts">Charts</button>
  <button role="tab" aria-selected="false" data-t="map">Structure–function map</button>
  <button role="tab" aria-selected="false" data-t="dock">Periodic Dock</button>
  <button role="tab" aria-selected="false" data-t="flow">Flow</button>
  <button role="tab" aria-selected="false" data-t="papers">Papers</button>
  <button role="tab" aria-selected="false" data-t="predict">Estimate</button>
  <button role="tab" aria-selected="false" data-t="abbr">Abbreviations</button>
</nav>
<main>
<aside id="filters">
  <div><label for="q">Search</label><input id="q" type="search" placeholder="e.g. silver, curcumin, E. coli"></div>
  <div><label for="fFn">Function</label><select id="fFn"></select></div>
  <div><label for="fApp">Intended application</label><select id="fApp"></select></div>
  <div><label for="fAug">Augmentation class</label><select id="fAug"></select></div>
  <div><label for="fMet">Metric</label><select id="fMet"></select></div>
  <div><label for="fConf">Min. confidence <span id="confv">0</span></label><input id="fConf" type="range" min="0" max="1" step="0.05" value="0"></div>
  <button class="go" id="reset" type="button">Reset filters</button>
  <div class="small muted" id="count"></div>
</aside>
<section id="pane"></section>
</main>
<div class="xfx"><div class="tip" role="tooltip" hidden></div></div>

<script>
(function(){
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const median = a => { a = a.filter(v => v != null && isFinite(v)).sort((x, y) => x - y); if (!a.length) return null; const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };
const sgn = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v);
function num(v, dp) { if (v == null) return '–'; const a = Math.abs(v); const d = dp != null ? dp : (a >= 100 ? 0 : a >= 10 ? 1 : 2); return (v < 0 ? '−' : '') + a.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: d }); }

const FN_LABEL = { antimicrobial: 'Antimicrobial', antioxidant: 'Antioxidant', catalytic: 'Catalytic', drug_delivery: 'Drug delivery', mechanical: 'Mechanical', uv_shielding: 'UV shielding', adsorption: 'Adsorption', anticancer: 'Anticancer', pesticide: 'Pesticide', sensing: 'Sensing', conductivity: 'Conductivity', characterization: 'Characterization' };
const FN_COLOR = { Antimicrobial: '#D50032', Antioxidant: '#2F5BB7', Catalytic: '#6FA3C0', 'Drug delivery': '#B10000', Mechanical: '#5E6B7A', 'UV shielding': '#8FA9D6', Adsorption: '#3E4C73', Anticancer: '#F08CA2', Pesticide: '#A6C5D7', Sensing: '#E0587A', Conductivity: '#C98A96', Characterization: '#9AA3AF' };
const ROUTE_LABEL = { none: 'None (bare LNP)', encapsulation: 'Encapsulation', adsorption: 'Adsorption', physical_blend: 'Physical blend', in_situ_reduction: 'In-situ reduction', coprecipitation: 'Co-precipitation', grafting: 'Grafting', other: 'Other', lignin_reduction: 'Lignin as reductant', doping: 'Doping', nabh4_reduction: 'NaBH₄ reduction', coating: 'Coating', coordination: 'Coordination' };
const CLS_LABEL = { none: 'Bare LNP (control)', metal: 'Metal', metal_oxide: 'Metal oxide', inorganic: 'Inorganic', organic: 'Organic', polymer: 'Polymer', biomolecule: 'Biomolecule' };
const CLS_COLOR = { none: '#9AA3AF', metal: '#2F5BB7', metal_oxide: '#8FA9D6', inorganic: '#5E6B7A', organic: '#D50032', polymer: '#F08CA2', biomolecule: '#6FA3C0' };
const CLS_ORDER = ['metal', 'metal_oxide', 'inorganic', 'organic', 'polymer', 'biomolecule', 'none'];
const PALETTE = ['#D50032', '#2F5BB7', '#6FA3C0', '#B10000', '#8FA9D6', '#F08CA2', '#5E6B7A', '#7C1F31', '#A6C5D7', '#E0587A', '#3E4C73', '#C98A96', '#9AA3AF'];

const EL_SYM = 'H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og'.split(' ');
const EL_NAME = 'Hydrogen,Helium,Lithium,Beryllium,Boron,Carbon,Nitrogen,Oxygen,Fluorine,Neon,Sodium,Magnesium,Aluminium,Silicon,Phosphorus,Sulfur,Chlorine,Argon,Potassium,Calcium,Scandium,Titanium,Vanadium,Chromium,Manganese,Iron,Cobalt,Nickel,Copper,Zinc,Gallium,Germanium,Arsenic,Selenium,Bromine,Krypton,Rubidium,Strontium,Yttrium,Zirconium,Niobium,Molybdenum,Technetium,Ruthenium,Rhodium,Palladium,Silver,Cadmium,Indium,Tin,Antimony,Tellurium,Iodine,Xenon,Caesium,Barium,Lanthanum,Cerium,Praseodymium,Neodymium,Promethium,Samarium,Europium,Gadolinium,Terbium,Dysprosium,Holmium,Erbium,Thulium,Ytterbium,Lutetium,Hafnium,Tantalum,Tungsten,Rhenium,Osmium,Iridium,Platinum,Gold,Mercury,Thallium,Lead,Bismuth,Polonium,Astatine,Radon,Francium,Radium,Actinium,Thorium,Protactinium,Uranium,Neptunium,Plutonium,Americium,Curium,Berkelium,Californium,Einsteinium,Fermium,Mendelevium,Nobelium,Lawrencium,Rutherfordium,Dubnium,Seaborgium,Bohrium,Hassium,Meitnerium,Darmstadtium,Roentgenium,Copernicium,Nihonium,Flerovium,Moscovium,Livermorium,Tennessine,Oganesson'.split(',');
function elPos(z) {              // -> [row, col] on a grid with a spacer row 8 and f-block rows 9-10
  if (z === 1) return [1, 1]; if (z === 2) return [1, 18];
  if (z >= 57 && z <= 71) return [9, 3 + z - 57];
  if (z >= 89 && z <= 103) return [10, 3 + z - 89];
  const per = z <= 10 ? 2 : z <= 18 ? 3 : z <= 36 ? 4 : z <= 54 ? 5 : z <= 86 ? 6 : 7;
  const start = { 2: 3, 3: 11, 4: 19, 5: 37, 6: 55, 7: 87 }[per];
  const i = z - start;
  if (per <= 3) return [per, i < 2 ? i + 1 : i + 11];
  if (per <= 5) return [per, i + 1];
  if (z <= 56 || (z >= 87 && z <= 88)) return [per, i + 1];
  return [per, z - (per === 6 ? 72 : 104) + 4];

let DATA = null, R = [], PAP = [], byEl = new Map(), shelf = {}, BASE = null, REL = {}, AUGS = [], AUG_BY = new Map(), AUG_ROWS = new Map(), ELCMP = new Map();
function indexData() {
  R = DATA.records; PAP = DATA.papers; AUGS = DATA.augs;
  R.forEach((r, i) => { r.i = i; r.pid = PAP[r.p].id; });
  AUG_BY = new Map(AUGS.map(a => [a.n, a]));
  byEl = new Map(); shelf = { mol: new Map(), mol2: new Map(), poly: new Map(), bio: new Map(), ox: new Map(), nat: new Map(), mod: new Map() }; ELCMP = new Map();
  AUGS.forEach(a => { if (a.g === 'el') byEl.set(a.n, []); else shelf[a.g].set(a.n, []); (a.el || []).forEach(e => { if (!ELCMP.has(e)) ELCMP.set(e, []); ELCMP.get(e).push(a.n); }); });
  R.forEach(r => (r.ag || []).forEach(i => { const a = AUGS[i]; (a.g === 'el' ? byEl.get(a.n) : shelf[a.g].get(a.n)).push(r); }));
  AUG_ROWS = new Map(); byEl.forEach((v, k) => AUG_ROWS.set(k, v)); Object.values(shelf).forEach(m => m.forEach((v, k) => AUG_ROWS.set(k, v)));
  BASE = summarise(R.filter(r => r.c === 'none'));
  REL = {};
  ['d', 'z', 'x'].forEach(k => { const m = new Map(); R.forEach(r => { if (r.f === 'characterization' || r[k] == null || r.v == null) return; const key = r.m + '|' + (r.u || ''); if (!m.has(key)) m.set(key, []); m.get(key).push(r); }); REL[k] = m; });
}
function summarise(rows) {
  const cnt = k => { const m = new Map(); rows.forEach(r => { const v = r[k]; m.set(v, (m.get(v) || 0) + 1); }); return m; };
  const nm = k => { const v = rows.map(r => r[k]).filter(v => v != null); return { n: v.length, med: median(v) }; };
  return { n: rows.length, papers: new Set(rows.map(r => r.p)).size, d: nm('d'), z: nm('z'), x: nm('x'), a: nm('a'), l: nm('l'), fn: cnt('f'), rt: cnt('r'), lowConf: rows.filter(r => r.q != null && r.q < 0.6).length, q: median(rows.map(r => r.q)), rows };
}
function metricsFor(rows) {
  const g = new Map(); rows.forEach(r => { if (r.v == null) return; if (!g.has(r.m)) g.set(r.m, []); g.get(r.m).push(r); });
  return [...g].map(([m, rs]) => {
    const uc = new Map(); rs.forEach(r => uc.set(r.u || '', (uc.get(r.u || '') || 0) + 1));
    const unit = [...uc].sort((a, b) => b[1] - a[1])[0][0];
    const vals = rs.filter(r => (r.u || '') === unit).map(r => r.v);
    return { m, n: rs.length, unit, med: median(vals), nu: vals.length };
  }).sort((a, b) => (/coli/i.test(b.m) - /coli/i.test(a.m)) || b.n - a.n);
}
function topPapers(rows, k) {
  const c = new Map(); rows.forEach(r => c.set(r.p, (c.get(r.p) || 0) + 1));
  return [...c].sort((a, b) => b[1] - a[1]).slice(0, k).map(([p, n]) => ({ p: PAP[p], n }));
}
function paperHTML(list, H) {
  return list.map(({ p, n }) => {
    const who = p.label || p.id;
    const t = p.title ? esc(p.title.length > 92 ? p.title.slice(0, 90) + '…' : p.title) : '';
    const link = p.doi ? ` <a href="https://doi.org/${esc(p.doi)}" target="_blank" rel="noopener" data-doi="${esc(p.id)}">DOI</a>` : '';
    return `<div class="paper"><b>${esc(who)}</b> <span class="muted mono">${esc(p.id)} · ${n} rec.</span>${link}<span class="t">${t}</span></div>`;
  }).join('');
}
const tipEl = () => document.querySelector('.xfx .tip');
function showTip(html, x, y) { const t = tipEl(); t.innerHTML = html; t.hidden = false; const w = t.offsetWidth, h = t.offsetHeight; t.style.left = Math.min(innerWidth - w - 8, x + 14) + 'px'; t.style.top = Math.max(8, Math.min(innerHeight - h - 8, y + 14)) + 'px'; }
const hideTip = () => { tipEl().hidden = true; };

/* ============================================================ PROTOTYPE A: periodic dock */
function mainClass(rows) { const c = new Map(); rows.forEach(r => c.set(r.c, (c.get(r.c) || 0) + 1)); return [...c].sort((a, b) => b[1] - a[1])[0][0]; }
const disp = n => { const t = n.split(/[ (]/)[0]; return /^[a-z-]+$/.test(t) ? n[0].toUpperCase() + n.slice(1) : n; };
const structOf = (cls, lab) => (DATA.structs && DATA.structs[lab]) || null;
function selInfo(sel) {
  if (!sel) return null;
  const rows = sel.kind === 'el' ? byEl.get(sel.sym) : (AUG_ROWS.get(sel.label) || []);
  const S = summarise(rows); S.sel = sel; S.set = new Set(rows);
  S.short = sel.kind === 'el' ? sel.sym : disp(sel.label);
  S.title = sel.kind === 'el' ? `${EL_NAME[EL_SYM.indexOf(sel.sym)]} (${sel.sym}), metal or ion` : disp(sel.label);
  S.cls = sel.kind === 'el' ? 'metal' : (AUG_BY.get(sel.label) || {}).c || 'organic';
  return S;
}
const selKey = s => s.kind === 'el' ? s.sym : s.cls + ':' + s.label;
function mountDock(root, H) {
  const st = { mode: 'all', sel: null, cmp: null, cmpMode: false, lvl: 'mol', sub: 'poly', q: '', elf: null, relX: 'd', relM: null, open: null };
  const fnModes = ['antimicrobial', 'antioxidant', 'catalytic', 'drug_delivery', 'mechanical', 'uv_shielding', 'adsorption', 'anticancer'];
  root.innerHTML = `<div class="dock">
    <section class="card dock-left" aria-label="Elements">
      <div class="row" style="justify-content:space-between"><h2 id="lefttitle">Choose an augmentation</h2><span class="muted" style="font-size:12.5px">Drag a tile onto the particle, or click it.</span></div>
      <div><div class="muted" style="font-size:12px;margin-bottom:5px">Colour elements by number of records</div><div class="chips" id="modes"></div></div>
      <div class="ptwrap"><div class="pt" id="pt" role="group" aria-label="Periodic table"></div></div>
      <div class="ramp"><span>fewer</span><i></i><span>more records</span><span style="margin-left:12px">Dashed = in the database, none for this function</span></div>
      <div class="shelf">
        <div class="muted" style="font-size:12px">Every augmentation in the database is its own entry. The table above holds the metals and metal ions only. Drag an entry onto the particle, or click it. Entries made of several parts (for example ZnO plus curcumin) appear under each part.</div>
        <div class="tabs" role="tablist" id="shelftabs" aria-label="Augmentation level"></div>
        <div class="row" style="gap:8px;flex-wrap:wrap"><input id="shq" type="search" class="srch" aria-label="Search augmentations" placeholder="Search by name"><div class="chips" id="subtabs" role="group" aria-label="Group"></div><span id="elfchip"></span></div>

      </div>
    </section>
    <section class="card dock-right" id="drop" aria-live="polite"></section>
  </div>`;
  const drop = $('#drop', root);

  function modeRows(sym) { const rs = byEl.get(sym) || []; return st.mode === 'all' ? rs : rs.filter(r => r.f === st.mode); }
  function buildTable() {
    const pt = $('#pt', root); pt.innerHTML = '';
    let max = 1; EL_SYM.forEach(s => { if (byEl.has(s)) max = Math.max(max, modeRows(s).length); });
    EL_SYM.forEach((sym, i) => {
      const z = i + 1, [row, col] = elPos(z), has = byEl.has(sym), cmpOnly = !has && ELCMP.has(sym);
      const gr = row <= 7 ? row : row + 1;
      const c = document.createElement(has ? 'button' : 'div');
      c.className = 'el' + (has ? ' has' : ' off');
      c.style.gridRow = gr; c.style.gridColumn = col;
      let n = 0;
      if (has) {

        if (st.cmp && st.cmp.kind === 'el' && st.cmp.sym === sym) c.classList.add('selb');
      } else if (cmpOnly) { c.dataset.cmpel = sym; c.type = 'button'; c.className = 'el cmp'; c.title = EL_NAME[i] + ': only as a compound (' + ELCMP.get(sym).join(', ') + '). Click to list them.'; c.setAttribute('aria-label', `${EL_NAME[i]}, compounds only: ${ELCMP.get(sym).join(', ')}`); }
      else c.title = EL_NAME[i] + ': no records';
      c.innerHTML = `<span class="z">${z}</span><span class="s">${sym}</span><span class="n">${has ? n : (cmpOnly ? 'cmpd' : '')}</span>`;
      pt.appendChild(c);
    });
  }
  function buildModes() {
    $('#modes', root).innerHTML = [['all', 'All functions']].concat(fnModes.map(f => [f, FN_LABEL[f]])).map(([k, l]) => `<button class="chip" type="button" data-mode="${k}" aria-pressed="${st.mode === k}">${esc(l)}</button>`).join('');
  }
  const GRP = { poly: 'Polymers and matrices', bio: 'Biomolecules', ox: 'Oxides, salts and inorganics', nat: 'Natural mixtures', mod: 'Lignin modifications and generic labels', mol2: 'Small molecules, structure not drawn' };
  const cnt = m => [...m.values()].reduce((a, b) => a + b.length, 0);
  function buildShelf() {
    const nMol = shelf.mol.size, nOther = ['poly', 'bio', 'ox', 'nat', 'mod', 'mol2'].reduce((a, k) => a + shelf[k].size, 0);
    $('#shelftabs', root).innerHTML = [['mol', 'Molecules with a structure', nMol], ['list', 'Other augmentations', nOther]].map(([k, l, n]) => `<button role="tab" type="button" data-lvl="${k}" aria-selected="${st.lvl === k}">${l}<span class="muted mono" style="margin-left:6px;font-size:11px">${n}</span></button>`).join('');
    const sb = $('#subtabs', root); sb.style.display = st.lvl === 'list' ? '' : 'none';
    sb.innerHTML = Object.keys(GRP).map(k => `<button class="chip" type="button" data-sub="${k}" aria-pressed="${st.sub === k}">${GRP[k]} <span class="mono" style="font-size:10.5px">${shelf[k].size}</span></button>`).join('');
    $('#elfchip', root).innerHTML = (st.elf && st.lvl === 'list') ? `<button class="chip" type="button" data-elclear aria-label="Clear element filter">Contains ${st.elf} ×</button>` : '';
    const q = st.q.trim().toLowerCase(), host = $('#shelfchips', root);
    const grp = st.lvl === 'mol' ? shelf.mol : shelf[st.sub];
    let items = [...grp].filter(([n]) => (!q || n.toLowerCase().includes(q)) && (!(st.elf && st.lvl === 'list') || (AUG_BY.get(n).el || []).includes(st.elf))).sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));
    const mx = Math.max(1, ...items.map(i => i[1].length));

    pdi: { title: 'PDI', f: r => r.x == null ? 'Not reported' : r.x <= .1 ? '≤ 0.1' : r.x <= .2 ? '0.1–0.2' : r.x <= .3 ? '0.2–0.3' : '> 0.3', order: ['≤ 0.1', '0.1–0.2', '0.2–0.3', '> 0.3', 'Not reported'] }
  };

  const lab = id => id.split('|').slice(1).join('|');
  function build() {

    const fns = [recipeKey].concat(useS ? [BINS[st.struct].f] : []).concat([r => FN_LABEL[r.f]]);
    const roles = useS ? ['recipe', 'struct', 'fn'] : ['recipe', 'fn'];
    const nodes = new Map(), links = new Map();
    rows.forEach(r => {
      const ids = fns.map((f, l) => { const label = f(r), id = l + '|' + label; if (!nodes.has(id)) nodes.set(id, { id, layer: l, role: roles[l], label, items: [] }); return id; });
      const it = { r, ids }; ids.forEach(id => nodes.get(id).items.push(it));
      for (let l = 0; l < ids.length - 1; l++) { const k = ids[l] + '>' + ids[l + 1]; if (!links.has(k)) links.set(k, { source: ids[l], target: ids[l + 1], value: 0, items: [] }); const lk = links.get(k); lk.value++; lk.items.push(it); }
    });

    const byCount = l => arr.filter(n => n.layer === l).sort((a, b) => b.items.length - a.items.length).map(n => n.label);
    const ord = roles.map((ro, l) => ro === 'recipe' ? (st.recipe === 'class' ? CLS_ORDER.map(k => CLS_LABEL[k]) : byCount(l)) : ro === 'struct' ? BINS[st.struct].order : byCount(l));

  }
  const recipeColor = (label, i) => st.recipe === 'class' ? CLS_COLOR[Object.keys(CLS_LABEL).find(k => CLS_LABEL[k] === label)] : PALETTE[i % PALETTE.length];
  function topOf(items, layer, k) {
    const c = new Map(); items.forEach(it => c.set(it.ids[layer], (c.get(it.ids[layer]) || 0) + 1));
    return [...c].sort((a, b) => b[1] - a[1]).slice(0, k).map(([id, v]) => `${esc(lab(id))} <span class="mono">${v}</span>`).join(' · ');
  }
  function render() {

      <text class="lbl" x="${n.role === 'recipe' ? n.x0 - 8 : n.x1 + 8}" y="${cy}" dy=".35em" text-anchor="${n.role === 'recipe' ? 'end' : 'start'}">${esc(n.label)} <tspan class="c">${n.rows}</tspan></text></g>`; }).join('')}</g>`;
    const el = $('#sk', root); el.setAttribute('viewBox', `0 0 ${W} ${Hh}`); el.innerHTML = svg;
    cur = { isNR, gr, roles: g.roles, color, path, linkCol, linkEls: [...el.querySelectorAll('.link')], nodeEls: [...el.querySelectorAll('.node')], tr: el.querySelector('#tr') };
    $('#fsum', root).innerHTML = `Showing <b class="mono">${g.rows.length}</b> records from <b class="mono">${new Set(g.rows.map(r => r.p)).size}</b> papers. The number beside a block is its total records. Hover a band for its own count.${g.hidden ? ` ${g.hidden} with no reported ${esc(BINS[st.struct].title.toLowerCase())} are hidden.` : ''}`;
    if (st.sel && !gr.nodes.some(n => n.id === st.sel)) st.sel = null;
    el.querySelectorAll('.hit').forEach(p => {
      const l = gr.links[+p.dataset.l], vis = cur.linkEls[+p.dataset.l]; let timer = null;
      p.addEventListener('pointermove', e => {
        showTip(`<b>${esc(l.source.label)}</b> → <b>${esc(l.target.label)}</b><br><span class="mono">${l.value}</span> records on this band<br><span class="muted">${l.source.rows} in “${esc(l.source.label)}” in total · ${new Set(l.items.map(i => i.r.p)).size} papers</span>`, e.clientX, e.clientY);

    });
    cur.nodeEls.forEach(nd => {
      const n = gr.nodes.find(x => x.id === nd.dataset.id); let timer = null;
      const enter = e => {
        st.hover = n.id; paint();
        const bl = n.role === 'fn' ? n.targetLinks : n.sourceLinks, bs = bl.slice().sort((x, y) => y.value - x.value), to = (n.role === 'fn' ? 'Bands in: ' : 'Bands out: ') + bs.slice(0, 6).map(l => `${esc(n.role === 'fn' ? l.source.label : l.target.label)} <span class="mono">${l.value}</span>`).join(' · ') + (bs.length > 6 ? ` · +${bs.length - 6} more` : '');
        if (e && e.clientX != null) showTip(`<b>${esc(n.label)}</b><br><span class="mono">${n.rows}</span> records in this block · <span class="muted">${n.papers} papers</span><br><span class="muted">${to}</span>`, e.clientX, e.clientY);
        if (!timer) timer = setTimeout(() => H.log('flow-node-hover', n.label), 700);

      nd.addEventListener('click', act);

  }
  function paint() {

        <div class="sect"><h3>How to read it</h3><ul class="list"><li><b>Left:</b> how the particle was augmented.</li><li><b>Right:</b> what the material was tested for.</li><li><b>Middle (optional):</b> split by measured size, charge or polydispersity. Use “Split by structure” above.</li></ul></div>
        <p class="muted" style="font-size:12.5px">Each record is one reported measurement. Most records do not report size, zeta or PDI, so a split puts them in “Not reported”.</p>`;

    const colFor = id => { const l = +id.split('|')[0], ro = cur.roles[l], n = cur.gr.nodes.find(x => x.id === id); return n ? cur.color(n) : '#8fa3b8'; };
    aside.innerHTML = `<div><h2>${esc(selNode.label)}</h2><p class="muted"><span class="mono">${selNode.rows}</span> records from ${selNode.papers} papers</p></div>
      ${cur.roles.map((ro, l) => l === selNode.layer ? '' : `<div class="sect"><h3>${names[ro]}</h3>${dist(items, l, colFor)}</div>`).join('')}
      <div class="sect"><h3>Top papers</h3><div class="papers">${paperHTML(topPapers(items.map(i => i.r), 4), H)}</div></div>
      <button class="btn small" id="clear" type="button">Clear selection</button>`;
    $('#clear', aside).addEventListener('click', () => { st.sel = null; H.log('flow-clear', ''); side(); paint(); });

  seg('s-recipe', 'recipe');
  seg('s-struct', 'struct', () => { $('#c-nr', root).disabled = st.struct === 'none'; if (st.struct === 'none') { st.hideNR = false; $('#c-nr', root).checked = false; } });

  $('#c-char', root).addEventListener('change', e => { st.showChar = e.target.checked; H.log('flow-char', st.showChar); render(); });

}

<script>
(function(){
var DATA=[], view=[], sortKey="paper_id", sortDir=1;
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(r){ if(r.function_type==='antibacterial')r.function_type='antimicrobial'; // merge labels so Explorer matches Dock and Flow

  var v=r.value,u=r.unit;

}).catch(function(e){$("#pane").innerHTML='<div class="note">Could not load data.json: '+esc(e.message)+'</div>';});

  '<div class="row"><div><label for="pm">Metric</label><select id="pm">'+opts.map(function(o){return '<option value="'+esc(o)+'">'+esc(o.replace("|"," ("))+')</option>'}).join("")+'</select></div><div><label for="pc">Augmentation class</label><select id="pc"><option value="">any</option>'+uniq("aug_class").map(function(c){return '<option>'+c+'</option>'}).join("")+'</select></div><div><label for="ps">Species contains</label><input id="ps" placeholder="e.g. Ag, curcumin"></div><div><label for="pd">LNP size, nm (optional)</label><input id="pd" type="number" min="10" step="10" placeholder="150"></div></div><p><button class="go" id="pgo" type="button">Find comparable rows</button></p><div id="pout"></div></div>';
  var run=function(){
    var sel=$("#pm").value.split("|"),cl=$("#pc").value,sp=$("#ps").value.toLowerCase(),sz=parseFloat($("#pd").value);
    var pool=DATA.filter(function(r){return r.metric_name===sel[0]&&r.u===sel[1]&&r.v>0});
    var all=pool.map(function(r){return Math.log10(r.v)}),mean=all.reduce(function(a,b){return a+b},0)/all.length;
    var sc=pool.map(function(r){var s=0;if(cl&&r.aug_class===cl)s+=2;if(sp&&(r.aug_species||"").toLowerCase().indexOf(sp)>-1)s+=3;if(!isNaN(sz)&&r.lnp_dls_nm)s+=1/(1+Math.abs(Math.log(r.lnp_dls_nm/sz))*3);return {r:r,s:s}}).sort(function(a,b){return b.s-a.s});
    var top=sc.filter(function(x){return x.s>0}).slice(0,5);if(!top.length)top=sc.slice(0,5);
    var lv=top.map(function(x){return Math.log10(x.r.v)}),m=lv.reduce(function(a,b){return a+b},0)/lv.length;
    var sd=Math.sqrt(lv.reduce(function(a,b){return a+(b-m)*(b-m)},0)/lv.length);
    $("#pout").innerHTML='<p>Comparable-row estimate: <span class="big">'+fmt(Math.pow(10,m))+'</span> '+esc(sel[1])+' <span class="muted small">(about ×/÷ '+Math.pow(10,sd).toFixed(1)+')</span></p><p class="small muted">All-row geometric mean for this metric: '+fmt(Math.pow(10,mean))+' '+esc(sel[1])+' from '+pool.length+' rows in '+Object.keys(pool.reduce(function(o,r){o[r.paper_id]=1;return o},{})).length+' papers.</p><div class="scroll"><table><thead><tr><th>Paper</th><th>Augmentation</th><th>Value</th><th>Condition</th></tr></thead><tbody>'+top.map(function(x){return '<tr><td>'+esc(x.r.paper_id)+'</td><td>'+esc(x.r.aug_species)+'</td><td class="num">'+fmt(x.r.v)+'</td><td class="small">'+esc(x.r.test_condition)+'</td></tr>'}).join("")+'</tbody></table></div>';
  };
  $("#pgo").onclick=run;if(opts.length){var i=opts.indexOf("MIC_S_aureus|ug/mL");if(i>-1)$("#pm").value=opts[i];run();}
}
})();
</script>
</body>
